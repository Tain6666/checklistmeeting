<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Edit - จัดการข้อมูล</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4">⚙️ ตั้งค่าและเพิ่มข้อมูล (Rooms & Equipment)</h2>

    <div class="row">
        <div class="col-md-5 mb-4">
            <div class="card">
                <div class="card-header bg-primary text-white">เพิ่มห้องประชุมใหม่</div>
                <div class="card-body">
                    <form onsubmit="saveRoom(event)">
                        <div class="mb-3">
                            <label>ชื่อห้องประชุม</label>
                            <input type="text" id="roomName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>อาคาร</label>
                            <input type="text" id="roomBuilding" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>ลิงก์ภาพห้องประชุม (URL)</label>
                            <input type="url" id="roomImage" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">บันทึกห้องประชุม</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-7 mb-4">
            <div class="card">
                <div class="card-header bg-secondary text-white">เพิ่มอุปกรณ์ใหม่เข้าห้องประชุม</div>
                <div class="card-body">
                    <form onsubmit="saveEquipment(event)">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>เลือกห้องประชุม</label>
                                <select id="equipRoom" class="form-select" required>
                                    <option value="">-- โหลดรายชื่อห้อง... --</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>ประเภทเครื่อง</label>
                                <select id="equipType" class="form-select" required>
                                    <option value="จอ LED">จอ LED</option>
                                    <option value="PROJECTOR">PROJECTOR</option>
                                    <option value="ไมค์ประชุม">ไมค์ประชุม</option>
                                    <option value="TV">TV</option>
                                    <option value="ระบบ ZOOM">ระบบ ZOOM</option>
                                    <option value="อื่นๆ">อื่นๆ</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>รหัสทรัพย์สิน</label>
                                <input type="text" id="equipId" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>ยี่ห้อ / รุ่น</label>
                                <input type="text" id="equipBrand" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Serial No.</label>
                                <input type="text" id="equipSerial" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>วันที่ซื้อ</label>
                                <input type="date" id="equipBuyDate" class="form-control">
                            </div>
                            <div class="col-12 mb-3">
                                <label>ลิงก์รูปอุปกรณ์ (URL)</label>
                                <input type="url" id="equipImage" class="form-control">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100">บันทึกอุปกรณ์</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw3cng8MCNieY1EVNsvhEx2EB3Gccj8AZLbobzhs0vhPxbFFGTDoU-BFn_Be0mW95-2uA/exec"; // เปลี่ยนเป็น URL ของคุณ

    // โหลดรายชื่อห้องประชุมสำหรับ Dropdown ตอนเปิดหน้าเว็บ
    window.onload = async () => {
        const res = await fetch(`${GAS_URL}?action=getRooms`);
        const rooms = await res.json();
        const select = document.getElementById('equipRoom');
        select.innerHTML = '<option value="">-- กรุณาเลือกห้อง --</option>';
        rooms.forEach(r => {
            select.innerHTML += `<option value="${r.name}">${r.name} (${r.building})</option>`;
        });
    };

    async function saveRoom(e) {
        e.preventDefault();
        const payload = {
            action: "addRoom",
            name: document.getElementById('roomName').value,
            building: document.getElementById('roomBuilding').value,
            image: document.getElementById('roomImage').value
        };
        await postData(payload);
        alert("เพิ่มห้องประชุมสำเร็จ!");
        e.target.reset();
        window.onload(); // รีเฟรช dropdown
    }

    async function saveEquipment(e) {
        e.preventDefault();
        const payload = {
            action: "addEquipment",
            room: document.getElementById('equipRoom').value,
            type: document.getElementById('equipType').value,
            id: document.getElementById('equipId').value,
            brand: document.getElementById('equipBrand').value,
            serial: document.getElementById('equipSerial').value,
            buyDate: document.getElementById('equipBuyDate').value,
            image: document.getElementById('equipImage').value
        };
        await postData(payload);
        alert("เพิ่มอุปกรณ์สำเร็จ!");
        e.target.reset();
    }

    async function postData(payload) {
        // แจ้งเตือนผู้ใช้ระหว่างบันทึก
        document.body.style.cursor = 'wait';
        await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        document.body.style.cursor = 'default';
    }
</script>
</body>
</html>
