<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Meeting Room Checklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4">ตรวจสอบอุปกรณ์ห้องประชุม</h2>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <label class="form-label">เลือกห้องประชุม</label>
                    <select id="roomSelect" class="form-select" onchange="loadEquipment()">
                        <option value="">-- กรุณาเลือกห้อง --</option>
                    </select>
                </div>
                <div class="col-md-6 mt-4">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="checkPeriod" id="checkBefore" value="ก่อนประชุม" checked>
                        <label class="form-check-label" for="checkBefore">ตรวจสอบก่อนประชุม</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="checkPeriod" id="checkAfter" value="หลังประชุม">
                        <label class="form-check-label" for="checkAfter">ตรวจสอบหลังประชุม</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <form id="checklistForm" style="display:none;" onsubmit="submitChecklist(event)">
        <table class="table table-bordered bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ประเภทเครื่อง (รหัส)</th>
                    <th class="text-center">ปกติ</th>
                    <th class="text-center">ไม่ปกติ</th>
                    <th>หมายเหตุ</th>
                </tr>
            </thead>
            <tbody id="equipmentList">
                </tbody>
        </table>
        <button type="submit" class="btn btn-success w-100">บันทึกข้อมูล</button>
    </form>
</div>

<script>
    // ** ใส่ Web App URL ของคุณที่นี่ **
    const GAS_URL = "https://script.google.com/macros/s/YOUR_WEB_APP_ID/exec"; 

    // โหลดรายชื่อห้องประชุมเมื่อเปิดหน้าเว็บ
    window.onload = async () => {
        const res = await fetch(`${GAS_URL}?action=getRooms`);
        const rooms = await res.json();
        const select = document.getElementById('roomSelect');
        rooms.forEach(r => {
            select.innerHTML += `<option value="${r.name}">${r.name} (${r.building})</option>`;
        });
    };

    // โหลดอุปกรณ์เมื่อเลือกห้อง
    async function loadEquipment() {
        const room = document.getElementById('roomSelect').value;
        const form = document.getElementById('checklistForm');
        const tbody = document.getElementById('equipmentList');
        
        if (!room) { form.style.display = 'none'; return; }
        
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">กำลังโหลดข้อมูล...</td></tr>';
        form.style.display = 'block';

        const res = await fetch(`${GAS_URL}?action=getEquipmentByRoom&room=${room}`);
        const equipment = await res.json();
        
        tbody.innerHTML = '';
        equipment.forEach((eq, index) => {
            tbody.innerHTML += `
                <tr data-id="${eq.id}" data-type="${eq.type}">
                    <td>${eq.type} <br><small class="text-muted">${eq.id}</small></td>
                    <td class="text-center">
                        <input class="form-check-input" type="radio" name="status_${index}" value="ปกติ" checked>
                    </td>
                    <td class="text-center">
                        <input class="form-check-input" type="radio" name="status_${index}" value="ผิดปกติ">
                    </td>
                    <td><input type="text" class="form-control form-control-sm remark-input" placeholder="ระบุรายละเอียดถ้ามี"></td>
                </tr>
            `;
        });
    }

    // ส่งข้อมูลไปบันทึก
    async function submitChecklist(e) {
        e.preventDefault();
        const rows = document.querySelectorAll('#equipmentList tr');
        const items = [];
        
        rows.forEach((row, index) => {
            items.push({
                id: row.getAttribute('data-id'),
                type: row.getAttribute('data-type'),
                status: row.querySelector(`input[name="status_${index}"]:checked`).value,
                remark: row.querySelector('.remark-input').value
            });
        });

        const payload = {
            action: "saveChecklist",
            room: document.getElementById('roomSelect').value,
            checkPeriod: document.querySelector('input[name="checkPeriod"]:checked').value,
            items: items
        };

        // ใช้ text/plain เพื่อเลี่ยงการติด CORS policy preflight ในบางเบราว์เซอร์
        const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        
        const result = await res.json();
        if(result.status === "success") {
            alert("บันทึกข้อมูลเรียบร้อยแล้ว");
            document.getElementById('checklistForm').reset();
            loadEquipment(); // โหลดตารางใหม่
        }
    }
</script>
</body>
</html>
