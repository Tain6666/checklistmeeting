<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - สถิติห้องประชุม</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4">📊 Dashboard สถิติอุปกรณ์ห้องประชุม</h2>

    <div class="row mb-4 text-center">
        <div class="col-md-6">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">อุปกรณ์สถานะปกติ (ล่าสุด)</h5>
                    <h1 class="card-text" id="normalCount">-</h1>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                    <h5 class="card-title">อุปกรณ์ที่พบปัญหา (ผิดปกติ)</h5>
                    <h1 class="card-text" id="brokenCount">-</h1>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-warning text-dark fw-bold">
            ⚠️ รายการอุปกรณ์ที่พบปัญหาล่าสุด
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>วันที่เช็ค</th>
                        <th>ห้องประชุม</th>
                        <th>ประเภทเครื่อง</th>
                        <th>หมายเหตุ</th>
                    </tr>
                </thead>
                <tbody id="issueList">
                    <tr><td colspan="4" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw3cng8MCNieY1EVNsvhEx2EB3Gccj8AZLbobzhs0vhPxbFFGTDoU-BFn_Be0mW95-2uA/exec"; // เปลี่ยนเป็น URL ของคุณ

    window.onload = async () => {
        const res = await fetch(`${GAS_URL}?action=getDashboard`);
        const data = await res.json();
        
        document.getElementById('normalCount').innerText = data.normal;
        document.getElementById('brokenCount').innerText = data.broken;

        const tbody = document.getElementById('issueList');
        if(data.issues.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-success">ไม่พบอุปกรณ์ที่มีปัญหาในรอบการเช็คล่าสุด</td></tr>';
        } else {
            tbody.innerHTML = '';
            data.issues.forEach(issue => {
                tbody.innerHTML += `
                    <tr>
                        <td>${issue.date}</td>
                        <td>${issue.room}</td>
                        <td>${issue.type}</td>
                        <td class="text-danger">${issue.remark || '-'}</td>
                    </tr>
                `;
            });
        }
    };
</script>
</body>
</html>
